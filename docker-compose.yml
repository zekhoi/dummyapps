# Production-like stack: postgres + api (distroless) + web (nginx).
#   docker compose up --build        → http://localhost:5173
#   docker compose up -d postgres    → database only, for `moon run :dev` on the host
name: dummyapps

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
  POSTGRES_DB: ${POSTGRES_DB:-app}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: *db-env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    image: dummyapps-api:local
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: dummyapps-web:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
