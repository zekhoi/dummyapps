name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  moon:
    name: moon ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # run-report-action comments on the PR
    steps:
      - uses: actions/checkout@v7
        with:
          # moon needs history to compute affected projects.
          fetch-depth: 0
          filter: blob:none

      # Installs proto + moon and the toolchains pinned in .prototools.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Runs every affected build/test task (typecheck, test, vet, fmt, build).
      - run: moon ci

      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: moon
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: docker compose build
