# Hot reload for docker-compose.dev.yml — https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go"]
  exclude_dir = ["bin", "tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  # Polling is reliable across Docker Desktop bind mounts on macOS/Windows.
  poll = true
  poll_interval = 500
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
